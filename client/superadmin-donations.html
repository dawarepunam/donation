<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperAdmin Donations | HopeSpring</title>
    <link rel="stylesheet" href="/css/superadmin.css" />
  </head>
  <body class="superadmin-body" data-page="donations">
    <div id="superadminShell">
      <main data-page-content class="superadmin-stack">
        <section class="superadmin-card">
          <form id="donationSearchForm" class="superadmin-toolbar">
            <input id="donationSearch" type="search" placeholder="Search donor, campaign, or email" />
            <input id="dateFrom" type="date" />
            <input id="dateTo" type="date" />
            <button class="superadmin-btn-secondary" type="submit">Filter</button>
          </form>
        </section>
        <section class="superadmin-card">
          <div id="donationList"></div>
        </section>
      </main>
    </div>
    <script src="/js/app.js"></script>
    <script src="/js/superadmin.js"></script>
  </body>
</html>
