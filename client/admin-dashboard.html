<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | HopeSpring</title>
    <link rel="stylesheet" href="/css/admin-panel.css" />
  </head>
  <body class="admin-body" data-page="dashboard">
    <div id="adminShell">
      <main data-page-content>
        <section class="admin-grid" id="dashboardStats"></section>
        <section class="admin-grid">
          <div class="admin-col-6 admin-card">
            <div class="admin-section-head">
              <p class="admin-kicker">Recent Donations</p>
              <h2>Latest contributions</h2>
            </div>
            <div id="dashboardDonations"></div>
          </div>
          <div class="admin-col-6 admin-card">
            <div class="admin-section-head">
              <p class="admin-kicker">Campaign Performance</p>
              <h2>Progress and status</h2>
            </div>
            <div id="dashboardCampaigns"></div>
          </div>
        </section>
      </main>
    </div>
    <script src="/js/app.js"></script>
    <script src="/js/admin-panel.js"></script>
  </body>
</html>
