<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperAdmin User Detail | HopeSpring</title>
    <link rel="stylesheet" href="/css/superadmin.css" />
  </head>
  <body class="superadmin-body" data-page="userDetail">
    <div id="superadminShell">
      <main data-page-content class="superadmin-stack">
        <section id="userProfile"></section>
        <section class="superadmin-grid">
          <div class="superadmin-col-6 superadmin-card">
            <div class="superadmin-section-head">
              <p class="superadmin-kicker">Donations</p>
              <h2>Donation history</h2>
            </div>
            <div id="userDonationHistory"></div>
          </div>
          <div class="superadmin-col-6 superadmin-card">
            <div class="superadmin-section-head">
              <p class="superadmin-kicker">Subscriptions</p>
              <h2>Recurring support</h2>
            </div>
            <div id="userSubscriptions"></div>
          </div>
        </section>
      </main>
    </div>
    <script src="/js/app.js"></script>
    <script src="/js/superadmin.js"></script>
  </body>
</html>
