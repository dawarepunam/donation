<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketing Activity | HopeSpring</title>
    <link rel="stylesheet" href="/css/superadmin.css" />
  </head>
  <body class="superadmin-body" data-page="marketingActivity">
    <div id="superadminShell">
      <main data-page-content class="superadmin-stack">
        <section class="superadmin-grid">
          <article class="superadmin-card superadmin-col-6">
            <div class="superadmin-section-head">
              <p class="superadmin-kicker">Campaign Reach</p>
              <h2>Emails, WhatsApp and A/B activity</h2>
            </div>
            <div id="marketingCampaignActivity"></div>
          </article>
          <article class="superadmin-card superadmin-col-6">
            <div class="superadmin-section-head">
              <p class="superadmin-kicker">Audit Trail</p>
              <h2>Marketing role actions</h2>
            </div>
            <div id="marketingAuditActivity"></div>
          </article>
          <article class="superadmin-card superadmin-col-12">
            <div class="superadmin-section-head">
              <p class="superadmin-kicker">Impact Review</p>
              <h2>Approve or reject marketing impact updates</h2>
            </div>
            <div id="marketingImpactReview"></div>
          </article>
        </section>
      </main>
    </div>
    <script src="/js/app.js"></script>
    <script src="/js/superadmin.js"></script>
  </body>
</html>
