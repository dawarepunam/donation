<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperAdmin Analytics | HopeSpring</title>
    <link rel="stylesheet" href="/css/superadmin.css" />
  </head>
  <body class="superadmin-body" data-page="analytics">
    <div id="superadminShell">
      <main data-page-content class="superadmin-grid">
        <section class="superadmin-col-6 superadmin-card">
          <div class="superadmin-section-head">
            <p class="superadmin-kicker">Monthly Donations</p>
            <h2>Collection trend</h2>
          </div>
          <div id="analyticsDonations"></div>
        </section>
        <section class="superadmin-col-6 superadmin-card">
          <div class="superadmin-section-head">
            <p class="superadmin-kicker">Top Campaigns</p>
            <h2>Best fundraising performance</h2>
          </div>
          <div id="analyticsCampaigns"></div>
        </section>
        <section class="superadmin-col-12 superadmin-card">
          <div class="superadmin-section-head">
            <p class="superadmin-kicker">User Growth</p>
            <h2>New account creation</h2>
          </div>
          <div id="analyticsUsers"></div>
        </section>
      </main>
    </div>
    <script src="/js/app.js"></script>
    <script src="/js/superadmin.js"></script>
  </body>
</html>
