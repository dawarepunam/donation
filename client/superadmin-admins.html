<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperAdmin Admins | HopeSpring</title>
    <link rel="stylesheet" href="/css/superadmin.css" />
  </head>
  <body class="superadmin-body" data-page="admins">
    <div id="superadminShell">
      <main data-page-content class="superadmin-stack">
        <section class="superadmin-card">
          <div class="superadmin-toolbar">
            <form id="adminSearchForm" class="superadmin-toolbar">
              <input id="adminSearch" type="search" placeholder="Search admin by name or email" />
              <button class="superadmin-btn-secondary" type="submit">Search</button>
            </form>
            <a class="superadmin-btn" href="/superadmin/admins/add">+ Add Admin</a>
          </div>
        </section>
        <section class="superadmin-card">
          <div id="adminList"></div>
        </section>
      </main>
    </div>
    <script src="/js/app.js"></script>
    <script src="/js/superadmin.js"></script>
  </body>
</html>
