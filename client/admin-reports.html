<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Reports | HopeSpring</title>
    <link rel="stylesheet" href="/css/admin-panel.css" />
  </head>
  <body class="admin-body" data-page="reports">
    <div id="adminShell">
      <main data-page-content class="admin-stack">
        <section class="admin-toolbar">
          <button id="downloadAdminReport" class="admin-btn" type="button">Download Report</button>
        </section>
        <section class="admin-grid" id="reportSummary"></section>
        <section class="admin-grid">
          <div class="admin-col-6 admin-card">
            <div class="admin-section-head">
              <p class="admin-kicker">Monthly Report</p>
              <h2>Donation summary by month</h2>
            </div>
            <div id="monthlyReportList"></div>
          </div>
          <div class="admin-col-6 admin-card">
            <div class="admin-section-head">
              <p class="admin-kicker">Campaign Report</p>
              <h2>Campaign-wise totals</h2>
            </div>
            <div id="campaignReportList"></div>
          </div>
        </section>
      </main>
    </div>
    <script src="/js/app.js"></script>
    <script src="/js/admin-panel.js"></script>
  </body>
</html>
