<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | HopeSpring NGO</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card">
        <p class="eyebrow">Welcome back</p>
        <h1>Login to view your donation dashboard</h1>
        <div id="authMessage" class="auth-message hidden"></div>
        <form id="loginForm" class="auth-form">
          <label>
            Email
            <input id="email" type="email" required />
          </label>
          <label>
            Password
            <input id="password" type="password" required />
          </label>
          <button class="btn btn-primary full-width" type="submit">Login</button>
        </form>
        <p class="auth-switch">
          New donor? <a id="registerSwitchLink" href="register.html">Create an account</a>
        </p>
      </section>
    </main>

    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
