<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperAdmin Security | HopeSpring</title>
    <link rel="stylesheet" href="/css/superadmin.css" />
  </head>
  <body class="superadmin-body" data-page="security">
    <div id="superadminShell">
      <main data-page-content class="superadmin-grid">
        <section class="superadmin-col-6 superadmin-card">
          <div class="superadmin-section-head">
            <p class="superadmin-kicker">Suspicious Actions</p>
            <h2>Flagged activity</h2>
          </div>
          <div id="suspiciousList"></div>
        </section>
        <section class="superadmin-col-6 superadmin-card">
          <div class="superadmin-section-head">
            <p class="superadmin-kicker">Audit Logs</p>
            <h2>Admin event history</h2>
          </div>
          <div id="auditLogList"></div>
        </section>
      </main>
    </div>
    <script src="/js/app.js"></script>
    <script src="/js/superadmin.js"></script>
  </body>
</html>
