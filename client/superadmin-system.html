<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperAdmin System Settings | HopeSpring</title>
    <link rel="stylesheet" href="/css/superadmin.css" />
  </head>
  <body class="superadmin-body" data-page="system">
    <div id="superadminShell">
      <main data-page-content>
        <section class="superadmin-card">
          <div id="systemMessage"></div>
          <form id="systemForm" class="superadmin-form">
            <div class="superadmin-form-grid">
              <label class="superadmin-field">
                Tax %
                <input id="taxPercentage" type="number" min="0" max="100" />
              </label>
              <label class="superadmin-field">
                Platform fee %
                <input id="platformFeePercentage" type="number" min="0" max="100" />
              </label>
              <label class="superadmin-field">
                Support email
                <input id="supportEmail" type="email" />
              </label>
              <label class="superadmin-field">
                Receipt prefix
                <input id="receiptPrefix" />
              </label>
            </div>
            <label class="superadmin-checkbox">
              <input id="maintenanceMode" type="checkbox" />
              Enable maintenance mode
            </label>
            <label class="superadmin-field">
              Donation email template
              <textarea id="templateDonation"></textarea>
            </label>
            <label class="superadmin-field">
              Campaign approval email template
              <textarea id="templateCampaign"></textarea>
            </label>
            <label class="superadmin-field">
              Account status email template
              <textarea id="templateAccount"></textarea>
            </label>
            <label class="superadmin-field">
              Marketing thank you template
              <textarea id="templateMarketingThankYou"></textarea>
            </label>
            <label class="superadmin-field">
              Marketing campaign update template
              <textarea id="templateMarketingCampaign"></textarea>
            </label>
            <label class="superadmin-field">
              Marketing reminder template
              <textarea id="templateMarketingReminder"></textarea>
            </label>
            <button class="superadmin-btn" type="submit">Save System Settings</button>
          </form>
        </section>
      </main>
    </div>
    <script src="/js/app.js"></script>
    <script src="/js/superadmin.js"></script>
  </body>
</html>
