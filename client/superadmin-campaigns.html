<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperAdmin Campaigns | HopeSpring</title>
    <link rel="stylesheet" href="/css/superadmin.css" />
  </head>
  <body class="superadmin-body" data-page="campaigns">
    <div id="superadminShell">
      <main data-page-content class="superadmin-stack">
        <section class="superadmin-card">
          <form id="campaignSearchForm" class="superadmin-toolbar">
            <input id="campaignSearch" type="search" placeholder="Search by title, category, or location" />
            <select id="campaignStatus">
              <option value="">All statuses</option>
              <option value="pending">Pending</option>
              <option value="active">Active</option>
              <option value="rejected">Rejected</option>
              <option value="completed">Completed</option>
            </select>
            <button class="superadmin-btn-secondary" type="submit">Apply</button>
          </form>
        </section>
        <section class="superadmin-card">
          <div id="campaignList"></div>
        </section>
      </main>
    </div>
    <script src="/js/app.js"></script>
    <script src="/js/superadmin.js"></script>
  </body>
</html>
